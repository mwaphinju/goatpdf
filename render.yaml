# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Lets Render deploy this repo's Dockerfile directly (New > Blueprint in the
# Render dashboard, pointed at this repo) instead of clicking through the
# same options by hand.
#
# Upgraded from `free` to `pro` (2026-09-03) after the free plan's idle
# spin-down was directly observed causing real downtime — Render's runtime
# logs showed the process getting SIGTERM'd after ~15 minutes idle and
# taking ~80s to cold-restart on the next request. That gap is the most
# likely explanation for a Google Search Console "Blocked by robots.txt"
# result that persisted across a live re-test: a crawl request landing
# inside that restart window gets a connection failure, and Google's
# documented fallback for an unreachable robots.txt is to treat the whole
# site as disallowed. `pro` doesn't idle-spin-down, which removes that
# failure window entirely. IMPORTANT: this field is the source of truth if
# Render ever re-syncs this service from the Blueprint — if it's ever
# reverted to `free` here, a sync would silently downgrade the live service
# back to the plan that caused this.
services:
  - name: goatpdf
    type: web
    runtime: docker
    plan: pro
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Render injects PORT itself (defaults to 10000); next start already
      # respects process.env.PORT with no code change needed — see
      # DEPLOYMENT.md Section 3.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # set this in the Render dashboard once the real
          # onrender.com URL (or a custom domain) is known — see
          # DEPLOYMENT.md Section 8. Left unset, it falls back to the
          # https://goatpdf.app placeholder used during development.
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false # optional — set to a real GA4 Measurement ID (G-...)
          # in the Render dashboard to enable Google Analytics. Left unset,
          # GA4 stays fully disabled. See ANALYTICS.md.
      - key: ANALYTICS_ENABLED
        value: "false" # explicit and off by default; flip to "true" in the
          # dashboard only if analytics forwarding is actually configured.
    # GOATPDF_DISABLE_RATE_LIMIT is deliberately not listed here — it must
    # never be set in a real deployment (test-only escape hatch; see
    # DEPLOYMENT.md Section 1).
